services:
  - type: worker
    name: daily-email-automation
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RECEIVER_EMAIL
        sync: false
      - key: CRON_SCHEDULE
        value: 0 18 * * *
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: USE_QUOTES_API
        value: false
      - key: SEND_ON_STARTUP
        value: false
